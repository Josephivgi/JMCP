# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag is pushed (npm version patch && git push --follow-tags).
# The installed JMCP app checks these releases and offers an Update button.
# Run it by hand (workflow_dispatch) to build and test without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/subagents/package-lock.json

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v."
            exit 1
          fi

      - run: npm ci

      # jmcp-subagents ships with its own node_modules.
      - run: npm ci --omit=dev
        working-directory: servers/subagents

      - run: npm test

      # Make the draft release first. When electron-builder has to create it,
      # its uploads race and can make two releases on the same tag.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "JMCP ${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploads the installer and latest.yml to the draft. The app sees the
      # update once the draft gets its notes and is published.
      - name: Build and upload
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --win --publish never

      - name: Keep the installer from a build-only run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: jmcp-installer
          path: |
            dist/*.exe
            dist/latest.yml
